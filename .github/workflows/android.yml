name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Optional stable signing. Without these secrets the runner's own debug
      # key is used: fine for testing, but it differs from your local key, so
      # installing it over another build requires uninstalling first.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ADSPOCKET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ADSPOCKET_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-runner" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ADSPOCKET_KEYSTORE_PASSWORD: ${{ secrets.ADSPOCKET_KEYSTORE_PASSWORD }}
          ADSPOCKET_KEY_ALIAS: ${{ secrets.ADSPOCKET_KEY_ALIAS }}
          ADSPOCKET_KEY_PASSWORD: ${{ secrets.ADSPOCKET_KEY_PASSWORD }}
        run: flutter build apk --release --target=lib/main.dart

      - name: Name artifact
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AdsPocket-$VERSION.apk"
          (cd dist && sha256sum "AdsPocket-$VERSION.apk" > SHA256.txt)
          echo "Assinatura: $SIGNING" >> dist/SHA256.txt
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: AdsPocket-apk
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AdsPocket-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
