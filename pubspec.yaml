name: ads_pocket
description: Navegador pessoal para a Biblioteca de Anúncios da Meta.
publish_to: none
version: 1.2.0+3
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  sqflite: ^2.4.2
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  url_launcher: ^6.3.3
  google_mlkit_text_recognition: ^0.17.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/icons/
